services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: omni          # superusuario solo para migraciones; la app usa omni_app
      POSTGRES_PASSWORD: omni
      POSTGRES_DB: omnivoice
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro   # se ejecutan en orden alfabético: 001, 002, 003
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omni -d omnivoice"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]   # solo estado efímero
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    ports: ["${BACKEND_PORT:-8010}:8000"]   # puerto en tu máquina; dentro de Docker sigue siendo 8000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/readyz')"]
      interval: 10s
      retries: 6

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8010}
    ports: ["3000:3000"]
    depends_on: [backend]

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infrastructure/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    ports: ["3001:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
