# Overlay de producción:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Exige secretos reales (falla si faltan) y no publica PostgreSQL, Redis, Prometheus ni Grafana.
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}
      OMNI_APP_PASSWORD: ${OMNI_APP_PASSWORD:?define OMNI_APP_PASSWORD (hex, p. ej. openssl rand -hex 24)}
    ports: !reset []
  redis:
    ports: !reset []
  backend:
    ports: !reset []
    environment:
      ENVIRONMENT: production
      PERSISTENCE_BACKEND: postgres
      STATE_BACKEND: redis
      DATABASE_URL: postgresql+asyncpg://omni_app:${OMNI_APP_PASSWORD}@postgres:5432/omnivoice
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET (>=32 caracteres)}
      CORS_ORIGINS: ${CORS_ORIGINS:?define CORS_ORIGINS, p. ej. ["https://app.ejemplo.com"]}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1g }
  frontend:
    ports: !reset []
    build:
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?define PUBLIC_API_URL (URL pública del backend)}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  prometheus:
    ports: !reset []
  grafana:
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?define GRAFANA_ADMIN_PASSWORD}
    ports: !override ["127.0.0.1:3001:3000"]
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: omni
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: omnivoice
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - backups:/backups
    # Copia diaria con comprobación de integridad y rotación. Restauración: scripts/restore.sh
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/omnivoice-$$(date +%Y%m%d-%H%M%S).sql.gz
          if pg_dump | gzip > $$f && gzip -t $$f && [ -s $$f ]; then echo "backup ok $$f"; else echo "backup FALLO" >&2; fi
          find /backups -name 'omnivoice-*.sql.gz' -mtime +$$BACKUP_KEEP_DAYS -delete
          sleep 86400
        done
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?define APP_DOMAIN, p. ej. app.ejemplo.com}
      API_DOMAIN: ${API_DOMAIN:?define API_DOMAIN, p. ej. api.ejemplo.com}
    volumes:
      - ./infrastructure/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    ports: ["80:80", "443:443"]
    depends_on: [backend, frontend]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

volumes:
  caddy_data:
  backups:
