groups:
  - name: omnivoice
    rules:
      - alert: BackendCaido
        expr: up{job="omnivoice-backend"} == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "El backend no responde", runbook: "docs/RUNBOOK.md#incidentes" }
      - alert: LatenciaPrimerAudioAlta
        expr: histogram_quantile(0.5, sum(rate(omnivoice_first_audio_seconds_bucket[5m])) by (le)) > 0.5
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "p50 al primer audio > 0.5 s" }
      - alert: SilencioTrasInterrupcionAlto
        expr: histogram_quantile(0.95, sum(rate(omnivoice_barge_in_seconds_bucket[5m])) by (le)) > 0.2
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "p95 de silencio tras barge-in > 200 ms" }
      - alert: ErroresAltos
        expr: sum(rate(omnivoice_errors_total[5m])) > 1
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Más de 1 error/s sostenido" }
      - alert: FalloDePersistencia
        expr: rate(omnivoice_errors_total{kind="persistence"}[5m]) > 0
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "Fallos al guardar en la base de datos" }
      - alert: ProveedorDeVozFallando
        expr: rate(omnivoice_provider_reconnects_total{outcome="failed"}[5m]) > 0
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "Reconexiones fallidas al proveedor de voz (clave, cuota o caída)" }
      - alert: SesionesRechazadasPorTope
        expr: sum(rate(omnivoice_budget_rejected_total[10m])) > 0
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Se rechazan sesiones por tope de concurrencia o presupuesto diario" }
      - alert: ProveedorDeTelefoniaFallando
        expr: sum(rate(omnivoice_errors_total{kind=~"telephony_outbound|telephony_transfer|telephony_hangup|provider_connect"}[5m])) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "Fallan las órdenes al proveedor telefónico (marcar, transferir o colgar): clave, saldo o caída del proveedor", runbook: "docs/TELEPHONY_INTEGRATION.md" }
      - alert: FirmasDeTelefoniaInvalidas
        expr: rate(omnivoice_errors_total{kind="telephony_bad_signature"}[5m]) > 0.5
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Muchos webhooks de telefonía con firma inválida: token mal configurado o intento de suplantación" }
      - alert: LlamadasAbandonadas
        expr: increase(omnivoice_calls_abandoned_total[30m]) > 0
        for: 0m
        labels: { severity: warning }
        annotations: { summary: "Hay llamadas sin estado final que el vigilante cerró: el proveedor dejó de avisar (¿Status Callback sin configurar?) o una réplica cayó" }
      - alert: MarcacionesSalientesFallidas
        expr: rate(omnivoice_outbound_jobs_total{event="dial_failed"}[10m]) > 0
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "El proveedor rechaza llamadas salientes" }
      - alert: WebhooksSinEntregar
        expr: rate(omnivoice_webhook_deliveries_total{outcome="failed"}[15m]) > 0
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "Entregas de webhooks agotadas: algún receptor de clientes no responde" }
      - alert: WebhookDesactivadoAutomaticamente
        expr: increase(omnivoice_webhook_deliveries_total{outcome="endpoint_disabled"}[1h]) > 0
        for: 0m
        labels: { severity: warning }
        annotations: { summary: "Un webhook se desactivó tras fallos sostenidos: avisa al cliente" }
      - alert: DestinoDeTransferenciaBloqueado
        expr: increase(omnivoice_errors_total{kind="transfer_destination_blocked"}[1h]) > 0
        for: 0m
        labels: { severity: warning }
        annotations: { summary: "Se bloqueó una transferencia por destino no permitido: revisar números de operador y TRANSFER_ALLOWED_PREFIXES" }
