[tool.ruff]
line-length = 120
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]
ignore = ["E501", "E702", "E731", "B904", "S101", "S105", "S110", "S311", "B008"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"bench/*" = ["S"]
[tool.coverage.run]
source = ["app"]
branch = true
[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "raise SystemExit"]
