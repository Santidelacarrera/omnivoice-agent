name: Evaluaciones conversacionales (modelo real)
on:
  workflow_dispatch:
    inputs:
      min_pass_rate: { description: "Umbral mínimo de casos que deben pasar (0 a 1)", default: "0.9" }
permissions:
  contents: read
jobs:
  evals:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Evaluar el modelo real (gasta tokens)
        env: { ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}" }
        run: python -m evals.runner --min-pass-rate "${{ github.event.inputs.min_pass_rate }}"
