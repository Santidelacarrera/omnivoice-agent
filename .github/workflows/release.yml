name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        svc: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir
        env:
          SVC: ${{ matrix.svc }}
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
        run: |
          IMG=ghcr.io/${GITHUB_REPOSITORY,,}-${SVC}:${GITHUB_REF_NAME}
          if [ "$SVC" = frontend ]; then ARGS="--build-arg NEXT_PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost:8010}"; else ARGS=""; fi
          docker build -t "$IMG" $ARGS "$SVC"
          echo "IMG=$IMG" >> "$GITHUB_ENV"
      - name: Escanear vulnerabilidades (bloquea en HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMG }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - run: docker push "$IMG"
