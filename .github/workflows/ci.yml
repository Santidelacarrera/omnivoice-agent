name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pip-audit -r requirements.txt
      - name: pytest
        shell: bash
        run: |
          set -o pipefail
          # Cobertura de líneas y ramas con umbral mínimo: baja de 80 % = el job falla. Subirlo cuando crezca, no bajarlo.
          pytest -q --tb=short -rfE --cov --cov-report=term --cov-fail-under=80 2>&1 | tee /tmp/pytest.out || rc=$?
          # Los fallos se publican como anotaciones para verlos sin descargar logs.
          grep -E '^(FAILED|ERROR)|^E ' /tmp/pytest.out | head -25 | while IFS= read -r l; do echo "::error::${l:0:400}"; done || true
          if [ "${rc:-0}" != 0 ]; then tail -n 15 /tmp/pytest.out | while IFS= read -r l; do echo "::error::tail ${l:0:300}"; done; fi
          exit ${rc:-0}
      - name: Benchmark de humo del orquestador
        # Umbrales holgados (el runner de CI es lento y ruidoso): detectan regresiones grandes, no microoptimizaciones.
        run: python -m bench.orchestrator_bench --sessions 200 --rounds 3 --max-barge-p95-us 5000 --max-wall-seconds 60
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: omni, POSTGRES_PASSWORD: omni, POSTGRES_DB: omnivoice }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U omni" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install asyncpg==0.29.0
      - name: Aplicar migraciones con versión (y comprobar que repetir no hace nada)
        working-directory: backend
        env: { ADMIN_DATABASE_URL: "postgresql+asyncpg://omni:omni@localhost:5432/omnivoice" }
        run: |
          python -m app.migrate up
          python -m app.migrate up | grep -qx "Nada que aplicar"
          ! python -m app.migrate status | grep -q pending
      - name: RLS aísla organizaciones y omni_app no es superusuario
        run: |
          export PGURL="postgresql://omni_app:omni_app@localhost:5432/omnivoice"
          psql "postgresql://omni:omni@localhost:5432/omnivoice" -tAc "SELECT rolsuper OR rolbypassrls FROM pg_roles WHERE rolname='omni_app'" | grep -qx f
          [ "$(psql "$PGURL" -tAc "SET app.org_id='00000000-0000-0000-0000-000000000001'; SELECT count(*) FROM inventory" | tail -1)" -gt 0 ]
          [ "$(psql "$PGURL" -tAc "SET app.org_id='00000000-0000-0000-0000-0000000000ff'; SELECT count(*) FROM inventory" | tail -1)" -eq 0 ]
      - name: Grabaciones y retención (migración 004) con RLS forzada
        run: |
          export PGURL="postgresql://omni_app:omni_app@localhost:5432/omnivoice"
          psql "postgresql://omni:omni@localhost:5432/omnivoice" -tAc "SELECT relforcerowsecurity FROM pg_class WHERE relname='recordings'" | grep -qx t
          psql "$PGURL" -tAc "SET app.org_id='00000000-0000-0000-0000-0000000000ff'; SELECT count(*) FROM recordings" | tail -1 | grep -qx 0
          psql "postgresql://omni:omni@localhost:5432/omnivoice" -tAc "SELECT count(*) FROM information_schema.columns WHERE table_name='organizations' AND column_name IN ('retention_days','recording_enabled')" | grep -qx 2
  integration:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: omni, POSTGRES_PASSWORD: omni, POSTGRES_DB: omnivoice }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U omni" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Aplicar migraciones
        env: { ADMIN_DATABASE_URL: "postgresql+asyncpg://omni:omni@localhost:5432/omnivoice" }
        run: python -m app.migrate up
      - name: Pruebas contra PostgreSQL y Redis reales
        shell: bash
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://omni_app:omni_app@localhost:5432/omnivoice
          TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://omni:omni@localhost:5432/omnivoice
          TEST_REDIS_URL: redis://localhost:6379/0
        run: |
          set -o pipefail
          # Cobertura solo informativa: cuánto cubren estas pruebas por sí solas (persistencia PostgreSQL, migraciones, aprovisionamiento).
          pytest tests/integration -q --tb=short -rfE --cov --cov-report=term 2>&1 | tee /tmp/it.out || rc=$?
          grep -E '^(FAILED|ERROR)|^E ' /tmp/it.out | head -25 | while IFS= read -r l; do echo "::error::${l:0:400}"; done || true
          exit ${rc:-0}
  frontend:
    runs-on: ubuntu-24.04  # Playwright aún no admite las dependencias de ubuntu-latest (26.04)
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: node --test
        working-directory: sdk/js
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run build
        env: { NEXT_PUBLIC_API_URL: http://localhost:8000 }
      # Pruebas de interfaz (Playwright) contra un backend real en memoria y el frontend compilado.
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r ../backend/requirements.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env: { CI: "true" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: "frontend/playwright-report\nfrontend/test-results", retention-days: 7 }
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Construir imágenes de producción
        run: |
          docker build -t omnivoice-backend backend
          docker build -t omnivoice-frontend --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000 frontend
      - name: Validar overlay de producción
        run: cp .env.example .env && JWT_SECRET=x POSTGRES_PASSWORD=x OMNI_APP_PASSWORD=x APP_DOMAIN=a.test API_DOMAIN=b.test CORS_ORIGINS='["https://a"]' PUBLIC_API_URL=https://a GRAFANA_ADMIN_PASSWORD=x docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
