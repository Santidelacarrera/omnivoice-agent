name: contract
# Pruebas de contrato contra la API Realtime real de OpenAI. Necesitan el secreto OPENAI_API_KEY (con crédito).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
jobs:
  openai:
    runs-on: ubuntu-latest
    if: ${{ vars.RUN_CONTRACT_TESTS == 'true' || github.event_name == 'workflow_dispatch' }}
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt
      - run: pytest -q -m contract tests/contract
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
